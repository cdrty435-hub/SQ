<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STC WIP 통합 운영 대시보드 (1~16단계)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#eee;color:#1a1a1a}
.app{display:flex;min-height:100vh}

/* ── Sidebar ───────────────────────────── */
.side{width:280px;min-width:280px;background:#1f2937;color:#e5e7eb;height:100vh;position:sticky;top:0;overflow-y:auto}
.side-hd{padding:18px 16px 14px;border-bottom:1px solid #374151}
.side-hd .t1{font-size:14px;font-weight:700;color:#fff}
.side-hd .t2{font-size:10.5px;color:#9ca3af;margin-top:3px;line-height:1.5}
.side-group{font-size:10px;color:#6b7280;padding:12px 16px 4px;text-transform:uppercase;letter-spacing:.05em}
.side-item{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;cursor:pointer;border-left:3px solid transparent;font-size:12px;line-height:1.4}
.side-item:hover{background:#273244}
.side-item.active{background:#111827;border-left-color:#4a9eff;color:#fff}
.side-num{width:20px;height:20px;min-width:20px;border-radius:50%;background:#374151;color:#d1d5db;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.side-item.active .side-num{background:#4a9eff;color:#0b1220}
.side-label{color:#cbd5e1}
.side-item.active .side-label{color:#fff;font-weight:600}
.side-foot{padding:14px 16px;font-size:10px;color:#6b7280;border-top:1px solid #374151;margin-top:8px}

/* ── Main content ──────────────────────── */
.main{flex:1;padding:30px 40px 70px;max-width:1100px}
.crumb{font-size:11px;color:#888;margin-bottom:10px}
.crumb b{color:#1a4fa0}
.step-hd{border-bottom:3px solid #1a1a1a;padding-bottom:12px;margin-bottom:6px;display:flex;align-items:baseline;gap:10px}
.step-hd .n{font-size:22px;font-weight:800;color:#1a4fa0}
.step-hd .t{font-size:20px;font-weight:700}
.sheet-tag{display:inline-block;background:#eef1f6;border:1px solid #ccd3e0;color:#1a4fa0;font-size:10.5px;
  font-family:monospace;padding:2px 8px;border-radius:4px;margin-left:6px}
.step-desc{font-size:12.5px;color:#555;margin:10px 0 22px;line-height:1.7}

.linknav{display:flex;justify-content:space-between;font-size:11.5px;margin:26px 0 4px;color:#1a4fa0}
.linknav span{cursor:pointer}
.linknav span:hover{text-decoration:underline}

h3{font-size:13px;font-weight:700;margin-top:22px;margin-bottom:8px;color:#1a1a1a}
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px}
caption{caption-side:top;text-align:left;font-size:12px;font-weight:700;padding-bottom:6px}
th{background:#2b3648;color:#fff;font-weight:700;padding:7px 9px;text-align:left;font-size:11px;border:1px solid #2b3648}
td{padding:6.5px 9px;border:1px solid #ccc}
tr:nth-child(even) td{background:#fafafa}
.num-col{text-align:right}
.center{text-align:center}
.status-ok{color:#0a7a3d;font-weight:700}
.status-wn{color:#a35b00;font-weight:700}
.status-no{color:#b0261e;font-weight:700}

.note{font-size:11px;color:#666;background:#f7f7f7;border-left:3px solid #999;padding:9px 13px;margin:10px 0 18px;line-height:1.6}
.note b{color:#1a1a1a}
.formula{background:#eef1f6;border:1px solid #ccd3e0;padding:11px 15px;font-size:12px;margin:10px 0 18px;font-family:Consolas,monospace;line-height:1.8}
.flowtext{font-size:12px;margin:8px 0 18px}
.flowtext .arrow{color:#888;margin:0 5px}
.flowtext b{color:#1a1a1a}
.badge2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.badge2.ok{background:#dcf5e4;color:#0a7a3d}
.badge2.wn{background:#ffeecb;color:#a35b00}
.badge2.no{background:#fbdad8;color:#b0261e}
.badge2.gy{background:#e6e6e6;color:#555}
.live-frame-wrap{border:1px solid #ccd3e0;border-radius:6px;overflow:hidden;margin:6px 0 18px;background:#0b1015}
.live-frame-bar{display:flex;align-items:center;justify-content:space-between;background:#1f2937;color:#e5e7eb;padding:8px 14px;font-size:11.5px}
.live-frame-bar a{color:#7dc4ff;text-decoration:none;font-family:monospace;font-size:11px}
.live-frame-bar a:hover{text-decoration:underline}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#35d07f;margin-right:6px;box-shadow:0 0 0 3px rgba(53,208,127,.25)}
.live-frame-wrap iframe{width:100%;height:640px;border:0;display:block}
@media(max-width:960px){.live-frame-wrap iframe{height:480px}}
.ppt-wrap{border:1px solid #ccd3e0;border-radius:6px;overflow:hidden;margin:6px 0 18px;background:#11151c}
.ppt-bar{display:flex;align-items:center;justify-content:space-between;background:#1f2937;color:#e5e7eb;padding:8px 14px;font-size:11.5px}
.ppt-bar .ppt-title{font-weight:700}
.ppt-stage{position:relative;background:#000;display:flex;align-items:center;justify-content:center}
.ppt-stage img{width:100%;display:block;user-select:none}
.ppt-nav{position:absolute;top:0;bottom:0;width:15%;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.ppt-nav.next{right:0;background:linear-gradient(270deg,rgba(0,0,0,.35),transparent)}
.ppt-stage:hover .ppt-nav{opacity:1}
.ppt-nav span{font-size:26px;color:#fff;font-weight:700}
.ppt-thumbs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#161b22}
.ppt-thumbs img{height:46px;border-radius:3px;cursor:pointer;opacity:.5;border:2px solid transparent;flex-shrink:0}
.ppt-thumbs img.active{opacity:1;border-color:#4a9eff}
.ppt-count{font-family:monospace;font-size:11px;color:#9ca3af}
@media(max-width:960px){.side{position:relative;height:auto}.app{flex-direction:column}.main{max-width:none}}
</style></head><body>
<div class="app">
  <nav class="side" id="side">
    <div class="side-hd">
      <div class="t1">STC WIP 통합 운영 대시보드</div>
      <div class="t2">고객사 발주 → 2공장 → 1공장 → 2공장 → 출하 → 배송<br>전 구간 16단계 · 단계별 Google Sheets 연동</div>
    </div>
    <div id="sideList"></div>
    <div class="side-foot">STC Co., Ltd. · 공무팀<br>각 단계 = 독립 Google Sheets 탭 + Apps Script</div>
  </nav>
  <main class="main" id="main"></main>
</div>

function badge(text, level){ return `<span class="badge2 ${level}">${text}</span>`; }
const pptState = {};
function pptGo(uid, dir){
  const cur = pptState[uid] ?? 0;
  pptJump(uid, (cur + dir + PPT_SLIDES.length) % PPT_SLIDES.length);
}
function pptJump(uid, idx){
  pptState[uid] = idx;
  document.getElementById(uid+"_img").src = PPT_SLIDES[idx];
  document.getElementById(uid+"_count").textContent = (idx+1) + " / " + PPT_SLIDES.length;
  document.querySelectorAll("#"+uid+"_thumbs img").forEach((el,i)=>el.classList.toggle("active", i===idx));
}

/* ===================================================================
   렌더링
=================================================================== */
function renderSide(){
  const el = document.getElementById("sideList");
  el.innerHTML = STEPS.map(s => `
    <div class="side-item" id="nav-${s.key}" onclick="showStep('${s.key}')">
      <div class="side-num">${s.num}</div>
      <div class="side-label">${s.nav}</div>
    </div>`).join("");
}

function renderBlock(b){
  if(b.type === "note") return `<div class="note">${b.text}</div>`;
  if(b.type === "flow") return `<div class="flowtext">${b.text}</div>`;
  if(b.type === "formula") return `<div class="formula">${b.text.replace(/\n/g,"<br>")}</div>`;
  if(b.type === "iframe"){
    return `<div class="live-frame-wrap">
      <div class="live-frame-bar">
        <span><span class="live-dot"></span>${b.label||"실시간 연결"}</span>
        <a href="${b.src}" target="_blank" rel="noopener">${b.src} ↗</a>
      </div>
      <iframe src="${b.src}" loading="lazy" title="${b.label||'배송 관제'}"></iframe>
    </div>`;
  }
  if(b.type === "slideshow"){
    const uid = "ppt_" + Math.random().toString(36).slice(2,8);
    return `<div class="ppt-wrap">
      <div class="ppt-bar">
        <span class="ppt-title">📎 ${b.title||"참고자료"}</span>
        <span class="ppt-count" id="${uid}_count">1 / ${PPT_SLIDES.length}</span>
      </div>
      <div class="ppt-stage">
        <img id="${uid}_img" src="${PPT_SLIDES[0]}">
        <div class="ppt-nav prev" onclick="pptGo('${uid}',-1)"><span>‹</span></div>
        <div class="ppt-nav next" onclick="pptGo('${uid}',1)"><span>›</span></div>
      </div>
      <div class="ppt-thumbs" id="${uid}_thumbs">
        ${PPT_SLIDES.map((src,i)=>`<img src="${src}" class="${i===0?'active':''}" onclick="pptJump('${uid}',${i})">`).join("")}
      </div>
    </div>`;
  }
  if(b.type === "table"){
    const isNumCol = (h) => /수량|CAPA|인원|일수|샘플수|불량수|Ac\(|Re\(/.test(h);
    return `<table><caption>${b.caption}</caption><thead><tr>${
      b.headers.map(h=>`<th>${h}</th>`).join("")
    }</tr></thead><tbody>${
      b.rows.map(r => `<tr>${r.map((v,i)=>`<td class="${isNumCol(b.headers[i])?'num-col':''}">${v}</td>`).join("")}</tr>`).join("")
    }</tbody></table>`;
  }
  return "";
}

function showStep(key){
  const idx = STEPS.findIndex(s=>s.key===key);
  const s = STEPS[idx];
  document.querySelectorAll(".side-item").forEach(el=>el.classList.remove("active"));
  document.getElementById("nav-"+key).classList.add("active");

  const prev = STEPS[idx-1], next = STEPS[idx+1];
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="crumb">STC WIP 통합 운영 대시보드 <b>›</b> ${s.num}. ${s.nav}</div>
    <div class="step-hd"><span class="n">${s.num}.</span><span class="t">${s.title}</span><span class="sheet-tag">${s.tab}</span></div>
    <div class="step-desc">${s.desc}</div>
    ${s.blocks.map(renderBlock).join("")}
    <div class="linknav">
      <span onclick="${prev?`showStep('${prev.key}')`:''}">${prev?`← ${prev.num}. ${prev.nav}`:''}</span>
      <span onclick="${next?`showStep('${next.key}')`:''}">${next?`${next.num}. ${next.nav} →`:''}</span>
    </div>
  `;
  window.scrollTo({top:0, behavior:"instant"});
}

renderSide();
showStep("s1");
</script>

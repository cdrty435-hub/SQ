function badge(text, level){ return `<span class="badge2 ${level}">${text}</span>`; }

/* ===================================================================
   렌더링
=================================================================== */
function renderSide(){
  const el = document.getElementById("sideList");
  el.innerHTML = STEPS.map(s => `
    <div class="side-item" id="nav-${s.key}" onclick="showStep('${s.key}')">
      <div class="side-num">${s.num}</div>
      <div class="side-label">${s.nav}</div>
    </div>`).join("");
}

function renderBlock(b){
  if(b.type === "note") return `<div class="note">${b.text}</div>`;
  if(b.type === "flow") return `<div class="flowtext">${b.text}</div>`;
  if(b.type === "formula") return `<div class="formula">${b.text.replace(/\n/g,"<br>")}</div>`;
  if(b.type === "table"){
    const isNumCol = (h) => /수량|CAPA|인원|일수|샘플수|불량수|Ac\(|Re\(/.test(h);
    return `<table><caption>${b.caption}</caption><thead><tr>${
      b.headers.map(h=>`<th>${h}</th>`).join("")
    }</tr></thead><tbody>${
      b.rows.map(r => `<tr>${r.map((v,i)=>`<td class="${isNumCol(b.headers[i])?'num-col':''}">${v}</td>`).join("")}</tr>`).join("")
    }</tbody></table>`;
  }
  return "";
}

function showStep(key){
  const idx = STEPS.findIndex(s=>s.key===key);
  const s = STEPS[idx];
  document.querySelectorAll(".side-item").forEach(el=>el.classList.remove("active"));
  document.getElementById("nav-"+key).classList.add("active");

  const prev = STEPS[idx-1], next = STEPS[idx+1];
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="crumb">STC WIP 통합 운영 대시보드 <b>›</b> ${s.num}. ${s.nav}</div>
    <div class="step-hd"><span class="n">${s.num}.</span><span class="t">${s.title}</span><span class="sheet-tag">${s.tab}</span></div>
    <div class="step-desc">${s.desc}</div>
    ${s.blocks.map(renderBlock).join("")}
    <div class="linknav">
      <span onclick="${prev?`showStep('${prev.key}')`:''}">${prev?`← ${prev.num}. ${prev.nav}`:''}</span>
      <span onclick="${next?`showStep('${next.key}')`:''}">${next?`${next.num}. ${next.nav} →`:''}</span>
    </div>
  `;
  window.scrollTo({top:0, behavior:"instant"});
}

renderSide();
showStep("s1");
</script>

<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2공장 발주계획 상세 프로세스</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#12101c;--card:#1e1a2e;--card2:#282239;--line:#3a3350;--tx:#ece8f5;--tx2:#9a92b0;
--ac:#e0605f;--ok:#3ddc84;--ng:#ff5c5c;--wn:#ffb84a;--bl:#4a9eff;--pu:#a78bfa}
body{font-family:'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--tx);padding:16px}
a{color:inherit}
.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
h1{font-size:19px;font-weight:700}h1 span{color:var(--ac)}
.sub{font-size:12px;color:var(--tx2);margin-top:3px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
button,select{background:var(--card2);color:var(--tx);border:1px solid var(--line);
padding:7px 11px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--ac)}
.navbtn{background:var(--card2);text-decoration:none;display:inline-flex;align-items:center;padding:7px 13px;border-radius:6px;font-size:13px;border:1px solid var(--line)}
.navbtn:hover{border-color:var(--ac)}

.steps{display:flex;flex-direction:column;gap:10px}
.step{border:1.5px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.step.open{border-color:var(--ac)}
.step-hd{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.step-num{width:32px;height:32px;min-width:32px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.step-titlewrap{flex:1;min-width:0}
.step-title{font-size:14.5px;font-weight:700}
.step-sub{font-size:11px;color:var(--tx2);margin-top:2px}
.step-chev{color:var(--tx2);font-size:12px;transition:transform .2s}
.step.open .step-chev{transform:rotate(180deg)}
.step-body{display:none;padding:0 18px 18px 62px;border-top:1px solid var(--line)}
.step.open .step-body{display:block;padding-top:16px}
.qbox{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.qbox b{display:block;font-size:12.5px;margin-bottom:5px;color:var(--tx)}
.qbox p{font-size:12px;color:var(--tx2);line-height:1.6}
.mono{font-family:monospace}

/* KPI row inside step3 */
.kpi3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.k3{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:11px;border-left:3px solid var(--ac)}
.k3.g{border-left-color:var(--ok)}.k3.y{border-left-color:var(--wn)}.k3.r{border-left-color:var(--ng)}
.k3l{font-size:10.5px;color:var(--tx2)}
.k3v{font-size:19px;font-weight:700;margin-top:3px}

/* Unified sheet */
.sheet{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.sheet-title{font-size:12.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sheet-title .tag{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:rgba(224,96,95,.18);color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#241f36;padding:8px 7px;text-align:left;color:var(--tx2);font-weight:600;font-size:10.5px;border-bottom:1px solid var(--line)}
td{padding:8px 7px;border-bottom:1px solid #322b4a}
tr:last-child td{border-bottom:none}
.b{padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;display:inline-block}
.b.ok{background:rgba(61,220,132,.15);color:var(--ok)}
.b.no{background:rgba(255,92,92,.15);color:var(--ng)}
.b.wn{background:rgba(255,184,74,.15);color:var(--wn)}
.b.gy{background:#332c48;color:var(--tx2)}
.b.bl{background:rgba(74,158,255,.15);color:var(--bl)}
.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.subgrid{grid-template-columns:1fr}}
.note{font-size:10.5px;color:var(--tx2);margin-top:8px;line-height:1.6}
.note b{color:var(--wn)}

/* Step4 plan preview */
.planline{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px}
.planline:first-child{border-top:none}
.planline .ord{width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.planline .txt{flex:1}
.planline .meta{color:var(--tx2);font-size:11px;font-family:monospace}

.flowtxt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.flowtxt .fb{background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:8px 12px}
.flowtxt .fb b{display:block;font-size:11px;color:var(--tx2);font-weight:600}
.flowtxt .ar{color:var(--ac)}
</style></head><body>

<div class="hd">
  <div>
    <h1>2공장 <span>발주계획</span> 상세 프로세스 <span style="font-size:12px;color:var(--tx2)">| Box 1 · 1~5단계</span></h1>
    <div class="sub">고객사 접수부터 1공장 발주 진행까지 — 가용자산(수량·인력·설비) 분석을 한 시트에서 확인</div>
  </div>
  <div class="ctl">
    <a class="navbtn" href="traceability.html">← 추적성 대시보드</a>
    <a class="navbtn" href="index.html">← 관리 시스템</a>
  </div>
</div>

<div class="steps" id="steps"></div>

<script>
const EQUIP = [
  { id:'DC1', status:'가동가능', model:['CN8 S','CN8 C'],       capa:180 },
  { id:'DC2', status:'가동가능', model:['CN8 S','CN8 H'],       capa:160 },
  { id:'DC3', status:'정비중',   model:['CN8 C'],               capa:150 },
  { id:'DC4', status:'가동가능', model:['CN8 S'],               capa:170 },
  { id:'DC5', status:'고장',     model:['CN8 H'],               capa:140 },
  { id:'DC6', status:'가동가능', model:['CN8 C','CN8 H'],       capa:155 },
  { id:'DC7', status:'고장',     model:['CN8 S'],               capa:175 },
  { id:'DC8', status:'가동가능', model:['CN8 C'],               capa:150 },
];
const WORKFORCE = [
  { shift:'주간조', required:12, assigned:11 },
  { shift:'야간조', required:10, assigned:10 },
];
const ORDER = [
  { model:'CN8 S', qty:660 },
  { model:'CN8 C', qty:440 },
  { model:'CN8 H', qty:2200 },
];
const PLAN_DAYS = 5;
const PO = { poNo:'PO-2026-0823-CN8', customer:'OO Motors', orderDate:'2026-08-20', items:ORDER };

function fmt(v){ return Number(v).toLocaleString(); }

function equipFor(model){
  return EQUIP.filter(e => e.model.includes(model) && e.status==='가동가능');
}
function capaFor(model){
  return equipFor(model).reduce((s,e)=>s+e.capa,0);
}
function verdict(model, qty){
  const capaDay = capaFor(model);
  const needDay = qty / PLAN_DAYS;
  const leadDays = capaDay ? qty/capaDay : Infinity;
  let level, label;
  if(capaDay===0){ level='no'; label='불가·가동설비 없음'; }
  else if(needDay <= capaDay){ level='ok'; label='가능·여유'; }
  else if(needDay <= capaDay*1.3){ level='wn'; label='주의·증산 검토'; }
  else{ level='no'; label='불가·증산 필요'; }
  return { capaDay, needDay, leadDays, level, label };
}

function renderSteps(){
  const wrap = document.getElementById('steps');

  const s1 = `
    <div class="qbox"><b>1) 고객사 접수를 어떻게 받을지</b>
      <p>고객사 PO(발주서)를 이메일/EDI로 접수 → 문서번호·모델·수량·납기를 등록합니다. 원본 PO는 파일로 첨부하여 SQ 심사 시 근거자료로 보관합니다.</p></div>
    <div class="sheet"><div class="sheet-title">접수된 PO <span class="tag">RAW</span></div>
      <table><thead><tr><th>문서번호</th><th>고객사</th><th>발주일</th><th>대상 모델</th><th>총 수량</th></tr></thead><tbody>
      <tr><td class="mono">${PO.poNo}</td><td>${PO.customer}</td><td>${PO.orderDate}</td>
      <td>${PO.items.map(i=>i.model).join(', ')}</td><td><b>${fmt(PO.items.reduce((s,i)=>s+i.qty,0))} EA</b></td></tr>
      </tbody></table></div>`;

  const s2 = `
    <div class="qbox"><b>2공장에서는 어떻게 받을지</b>
      <p>2공장 생산관리 담당자가 접수된 PO를 확인하고 시스템에 정식 등록합니다. 등록 즉시 상태는 <span class="b wn">가용자산분석 대기</span>로 전환되며, 3번 단계(가용자산분석)로 자동 연결됩니다.</p></div>
    <div class="flowtxt">
      <div class="fb"><b>PO 수신</b>고객사 원본 PO</div><span class="ar">→</span>
      <div class="fb"><b>2공장 확인</b>담당자 검토</div><span class="ar">→</span>
      <div class="fb" style="border-color:var(--wn)"><b style="color:var(--wn)">시스템 등록</b>가용자산분석 대기</div><span class="ar">→</span>
      <div class="fb" style="border-color:var(--ac)"><b style="color:var(--ac)">3단계 진입</b>가용자산분석</div>
    </div>`;

  // ── Step 3: 통합 시트 ──────────────────
  const verdicts = ORDER.map(o => ({...o, v: verdict(o.model, o.qty)}));
  const anyNo = verdicts.some(x=>x.v.level==='no');
  const anyWn = verdicts.some(x=>x.v.level==='wn');
  const wfShort = WORKFORCE.filter(w=>w.assigned<w.required);

  const s3 = `
    <div class="qbox"><b>수량을 받으면 어떻게 분석하는지 / 인력은 어떻게 관리할지 / 설비 CAPA는 어떻게 할지</b>
      <p>모델별 <b style="color:var(--tx)">요청수량</b>을 <b style="color:var(--tx)">가동 가능 설비의 CAPA</b>와 대조해 필요 소요일수를 계산하고, <b style="color:var(--tx)">인력 배치 현황</b>을 함께 확인해 생산 가능 여부를 한 번에 판정합니다.</p></div>

    <div class="kpi3">
      <div class="k3 ${anyNo?'r':anyWn?'y':'g'}"><div class="k3l">종합 판정</div><div class="k3v">${anyNo?'검토필요':anyWn?'주의':'가능'}</div></div>
      <div class="k3"><div class="k3l">가동가능 설비</div><div class="k3v">${EQUIP.filter(e=>e.status==='가동가능').length} / ${EQUIP.length}대</div></div>
      <div class="k3 ${wfShort.length?'y':'g'}"><div class="k3l">인력 배치</div><div class="k3v">${WORKFORCE.reduce((s,w)=>s+w.assigned,0)} / ${WORKFORCE.reduce((s,w)=>s+w.required,0)}명</div></div>
      <div class="k3"><div class="k3l">총 요청수량</div><div class="k3v">${fmt(ORDER.reduce((s,o)=>s+o.qty,0))} EA</div></div>
    </div>

    <div class="sheet">
      <div class="sheet-title">통합 가용자산분석 시트 <span class="tag">수량 × 설비CAPA × 인력 · 1 SHEET</span></div>
      <table><thead><tr>
        <th>모델</th><th>요청수량</th><th>가동 설비</th><th>설비 CAPA/일</th><th>필요 CAPA/일</th><th>소요일수</th><th>인력 영향</th><th>종합판정</th>
      </tr></thead><tbody>
      ${verdicts.map(x=>{
        const eq = equipFor(x.model);
        const wfNote = wfShort.length ? `${wfShort.map(w=>w.shift).join('·')} 부족` : '충족';
        return `<tr>
          <td><b>${x.model}</b></td>
          <td>${fmt(x.qty)} EA</td>
          <td>${eq.length}대 (${eq.map(e=>e.id).join(', ')||'-'})</td>
          <td>${fmt(x.v.capaDay)} EA</td>
          <td>${fmt(Math.round(x.v.needDay))} EA</td>
          <td>${isFinite(x.v.leadDays)?x.v.leadDays.toFixed(1)+'일':'-'}</td>
          <td><span class="b ${wfShort.length?'wn':'ok'}">${wfNote}</span></td>
          <td><span class="b ${x.v.level}">${x.v.label}</span></td>
        </tr>`;
      }).join('')}
      </tbody></table>
      <div class="note">계획기간 <b>${PLAN_DAYS}일</b> 기준 · 소요일수가 계획기간을 초과하면 <b>주의/불가</b>로 자동 판정됩니다. CN8 H는 DC5 고장으로 가동설비가 줄어 소요일수가 계획기간을 초과 — 4번(계획수립) 단계에서 증산 또는 납기 조정이 필요합니다.</div>
    </div>

    <div class="subgrid">
      <div class="sheet">
        <div class="sheet-title">설비 CAPA 현황 <span class="tag">DC1~DC23 중 발췌</span></div>
        <table><thead><tr><th>설비</th><th>상태</th><th>대응 모델</th><th>CAPA/일</th></tr></thead><tbody>
        ${EQUIP.map(e=>`<tr><td class="mono">${e.id}</td>
          <td><span class="b ${e.status==='가동가능'?'ok':e.status==='정비중'?'wn':'no'}">${e.status}</span></td>
          <td>${e.model.join(', ')}</td><td>${fmt(e.capa)} EA</td></tr>`).join('')}
        </tbody></table>
      </div>
      <div class="sheet">
        <div class="sheet-title">인력 배치 현황</div>
        <table><thead><tr><th>조</th><th>필요인원</th><th>배치인원</th><th>상태</th></tr></thead><tbody>
        ${WORKFORCE.map(w=>`<tr><td>${w.shift}</td><td>${w.required}명</td><td>${w.assigned}명</td>
          <td><span class="b ${w.assigned>=w.required?'ok':'wn'}">${w.assigned>=w.required?'충족':(w.required-w.assigned)+'명 부족'}</span></td></tr>`).join('')}
        </tbody></table>
        <div class="note">부족 인력은 타 라인 지원 또는 잔업 배치로 보완 여부를 4번 단계 계획수립에 반영합니다.</div>
      </div>
    </div>`;

  // ── Step 4: 계획수립 (3번 결과 기반) ──────────────────
  const sortedByRisk = [...verdicts].sort((a,b)=>{
    const order = {no:0, wn:1, ok:2};
    return order[a.v.level]-order[b.v.level];
  });
  const s4 = `
    <div class="qbox"><b>3번에서 가용자산을 분석한 자료를 기반으로 계획수립</b>
      <p>판정이 '검토필요/주의'인 모델을 우선순위 상단에 배치하고, 여유가 있는 모델은 후순위로 자동 정렬한 생산계획(안)입니다. 실제 승인 전 최종 검토가 필요합니다.</p></div>
    <div class="sheet">
      <div class="sheet-title">생산 계획(안) <span class="tag">위험도순 자동 정렬</span></div>
      ${sortedByRisk.map((x,i)=>`
        <div class="planline">
          <div class="ord">${i+1}</div>
          <div class="txt"><b>${x.model}</b> — ${fmt(x.qty)} EA <span class="b ${x.v.level}" style="margin-left:6px">${x.v.label}</span></div>
          <div class="meta">${isFinite(x.v.leadDays)?x.v.leadDays.toFixed(1)+'일 소요':'설비 확보 필요'}</div>
        </div>`).join('')}
      <div class="note">${anyNo ? '<b>CN8 H</b>는 계획기간 내 생산이 어려우므로, 설비 정비 일정 단축 또는 납기 재협의를 병행 검토하세요.' : '모든 모델이 계획기간 내 생산 가능합니다.'}</div>
    </div>`;

  const s5 = `
    <div class="qbox"><b>2공장 → 1공장 발주 진행</b>
      <p>4번에서 확정된 계획을 기준으로 1공장에 발주수량을 통보합니다. 통보와 동시에 System 1 승인 게이트가 기록되고, 이후 1공장의 생산계획(Box 2)으로 이어집니다.</p></div>
    <div class="sheet">
      <div class="sheet-title">발주수량 통보 (FAC2 → FAC1)</div>
      <table><thead><tr><th>모델</th><th>확정 수량</th><th>생산 순서</th><th>비고</th></tr></thead><tbody>
      ${sortedByRisk.map((x,i)=>`<tr><td><b>${x.model}</b></td><td>${fmt(x.qty)} EA</td><td>${i+1}순위</td>
        <td>${x.v.level==='no'?'<span class="b no">증산/납기 협의 필요</span>':'<span class="b ok">정상 진행</span>'}</td></tr>`).join('')}
      </tbody></table>
      <div class="note">통보 시각 자동 기록 → Box 2(1공장 생산계획) 및 System 4 대시보드에 실시간 반영됩니다.</div>
    </div>`;

  const STEPS = [
    { n:1, title:'고객사 접수', sub:'고객사 PO를 어떻게 받을지', body:s1, open:false },
    { n:2, title:'2공장에서는 어떻게 받을지', sub:'접수 확인 → 시스템 등록', body:s2, open:false },
    { n:3, title:'2공장 가용자산 분석', sub:'수량 × 인력 × 설비 CAPA — 통합 시트', body:s3, open:true },
    { n:4, title:'2공장 계획수립', sub:'3번 분석 결과 기반 생산계획(안)', body:s4, open:true },
    { n:5, title:'2공장 → 1공장 발주 진행', sub:'확정 수량 통보', body:s5, open:false },
  ];

  wrap.innerHTML = STEPS.map((s,i) => `
    <div class="step ${s.open?'open':''}" id="step-${i}">
      <div class="step-hd" onclick="toggleStep(${i})">
        <div class="step-num">${s.n}</div>
        <div class="step-titlewrap">
          <div class="step-title">${s.title}</div>
          <div class="step-sub">${s.sub}</div>
        </div>
        <div class="step-chev">▾</div>
      </div>
      <div class="step-body">${s.body}</div>
    </div>`).join('');
}
function toggleStep(i){
  document.getElementById('step-'+i).classList.toggle('open');
}
renderSteps();
</script>
</body></html>
